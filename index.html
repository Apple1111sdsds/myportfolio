<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>John Carlo - Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HOME PAGE
    ========================== -->

    <section id="home" class="page active">

        <div class="home-container">

            <!-- Profile picture -->
            <div class="profile-picture">
                <img src="a4a.jpg" alt="Profile">
            </div>

            <!-- Introduction -->
            <div class="intro">

                <h1>
                    Hi! I'm
                    <span>John Carlo Abiva</span>
                </h1>

                <p>
                    I am a game developer and artist who mainly focused in making 2d game using godot and making character design concept .
                </p>

            </div>


            <!-- Category buttons -->

            <div class="categories">

                <div
                    class="category-card"
                    onclick="openCategory('2d')"
                >
                    <img src="1a.jpg">

                    <h3>2D Arts</h3>
                </div>


                <div
                    class="category-card"
                    onclick="openCategory('3d')"
                >
                    <img src="a7a.jpg">

                    <h3>3D Arts</h3>
                </div>


                <div
                    class="category-card"
                    onclick="openCategory('games')"
                >
                    <img src="a5.jpg">

                    <h3>Games</h3>
                </div>

            </div>

        </div>

    </section>



    <!-- =========================
         CATEGORY PAGE
    ========================== -->

    <section id="category" class="page">

        <div class="category-container">

            <!-- Top navigation -->

            <div class="top-bar">

                <button
                    class="back-button"
                    onclick="goHome()"
                >
                    ←
                </button>

                <h1 id="category-title">
                    2D Arts
                </h1>

            </div>


            <!-- Project list -->

            <div
                id="project-grid"
                class="project-grid"
            >

                <!-- Projects are generated by JavaScript -->

            </div>

        </div>

    </section>



    <!-- =========================
         PROJECT VIEWER
    ========================== -->

    <section id="viewer" class="page">

        <div class="viewer-container">

            <!-- Close button -->

            <button
                class="close-button"
                onclick="closeViewer()"
            >
                X
            </button>


            <!-- Main artwork -->

            <div class="viewer-image">

                <img
                    id="viewer-img"
                    src="a3.jpg"
                    alt="Artwork"
                >

            </div>


            <!-- Artwork information -->

            <div class="viewer-info">

                <h1 id="viewer-title">
                    Artwork Title
                </h1>

                <p id="viewer-description">
                    Artwork description.
                </p>

                <p>
                    <strong>Link:</strong>
                </p>

                <a
                    id="viewer-link"
                    href="#"
                    target="_blank"
                >
                    View Project
                </a>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
